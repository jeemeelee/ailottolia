<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AILOTTOLIA ADMIN</title>
<link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script>
</head>
<body>
<header>AILOTTOLIA ADMIN</header>
<main>
<p id="status" role="status" aria-live="polite">로그인 상태를 확인하고 있습니다.</p>
<section id="login" class="card login" hidden>
  <div class="label">ADMIN ACCESS</div><h1>관리자 로그인</h1>
  <p>등록된 관리자 계정으로 로그인해 주세요.</p>
  <form id="loginForm">
    <label for="email">이메일</label><input id="email" type="email" autocomplete="username" required maxlength="254">
    <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024">
    <button id="loginButton" type="submit">로그인</button>
  </form>
  <p class="note">로그인은 최대 1시간 유지됩니다.</p>
</section>
<section id="dashboard" hidden>
  <div class="heading"><div><h1>관리자 대시보드</h1><p id="account"></p></div><button id="logout" type="button">로그아웃</button></div>
  <section class="stats" aria-label="방문 통계">
    <div class="card"><div class="label">오늘 방문자</div><div class="value">—</div></div>
    <div class="card"><div class="label">이번 주 방문자</div><div class="value">—</div></div>
    <div class="card"><div class="label">전체 방문자</div><div class="value">—</div></div>
    <div class="card"><div class="label">번호 생성 횟수</div><div class="value">—</div></div>
  </section>
  <p class="note">방문 통계는 아직 연결되지 않았습니다.</p>
  <div class="grid">
    <section class="card"><h2>지역별 방문자</h2><p>대한민국　—</p><p>미국　—</p><p>일본　—</p><p>기타　—</p><p class="note">통계 연결 후 표시됩니다.</p></section>
    <section class="card"><div class="heading"><h2>저장된 프롬프트</h2><button id="reload" type="button">새로고침</button></div>
      <p id="promptStatus" role="status"></p><div id="prompts"></div>
      <p class="note">현재는 조회만 가능합니다. 프롬프트 저장과 메인 번호 생성 적용은 다음 단계에서 연결합니다.</p>
    </section>
  </div>
</section>
<button id="retry" type="button" hidden>다시 확인</button>
<noscript>관리자 로그인은 JavaScript가 필요합니다. 브라우저 설정에서 활성화해 주세요.</noscript>
</main>
</body></html>
